name: Build Andromeda .deb

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /tmp/theos
          echo "THEOS=/tmp/theos" >> $GITHUB_ENV

      - name: Install ldid
        run: brew install ldid

      - name: Setup SDK
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          mkdir -p /tmp/theos/sdks
          ln -sf "$SDK_PATH" "/tmp/theos/sdks/iPhoneOS${SDK_VERSION}.sdk"

      - name: Build
        run: make messages=yes

      - name: Package .deb
        run: |
          PKG="pack"
          mkdir -p "$PKG/DEBIAN" "$PKG/Library/MobileSubstrate/DynamicLibraries" "$PKG/Library/PreferenceBundles" "$PKG/Library/PreferenceLoader/Preferences"

          DYLIB=$(find .theos/obj/debug -name "Andromeda.dylib" -type f | head -1)
          BUNDLE=$(find .theos/obj/debug -name "AndromedaSettings.bundle" -type d | head -1)
          cp "$DYLIB" "$PKG/Library/MobileSubstrate/DynamicLibraries/"
          cp Andromeda.dylib/Andromeda.plist "$PKG/Library/MobileSubstrate/DynamicLibraries/"
          cp -r "$BUNDLE" "$PKG/Library/PreferenceBundles/"

          cat > "$PKG/Library/PreferenceLoader/Preferences/Andromeda.plist" << 'EOF'
          {"entry":{"bundle":"AndromedaSettings","cell":"PSLinkCell","detail":"AndromedaRootListController","isController":1,"label":"Andromeda"}}
          EOF

          cat > "$PKG/DEBIAN/control" << 'CTRL'
Package: com.andromeda.bypass
Name: Andromeda
Version: 4.0.0
Architecture: iphoneos-arm
Depends: firmware (>= 12.0), preferenceloader
Recommends: mobilesubstrate
Suggests: com.opa334.choicy
Description: Ultimate jailbreak detection bypass for dating apps and social media.
Maintainer: AndromedaTeam
Author: AndromedaTeam
Section: System
CTRL

          printf '#!/bin/sh\nset -e\nexit 0\n' > "$PKG/DEBIAN/postinst"
          printf '#!/bin/sh\nset -e\nexit 0\n' > "$PKG/DEBIAN/postrm"
          chmod 755 "$PKG/DEBIAN/postinst" "$PKG/DEBIAN/postrm"

          echo "=== Package ===" && find "$PKG" -type f | head -20

          cd "$PKG"
          tar -czf ../data.tar.gz --owner=0 --group=0 Library
          cd DEBIAN && tar -czf ../../control.tar.gz * && cd ../..
          echo "2.0" > debian-binary
          ar rc "com.andromeda.bypass_4.0.0_iphoneos-arm.deb" debian-binary control.tar.gz data.tar.gz
          ls -la *.deb

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Andromeda-deb
          path: com.andromeda.bypass_4.0.0_iphoneos-arm.deb

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          files: com.andromeda.bypass_4.0.0_iphoneos-arm.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
