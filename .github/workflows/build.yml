name: Build Andromeda .deb

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /tmp/theos
          echo "THEOS=/tmp/theos" >> $GITHUB_ENV

      - name: Install ldid
        run: |
          brew install ldid

      - name: Setup SDK
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Xcode SDK: $SDK_PATH (iOS $SDK_VERSION)"
          mkdir -p /tmp/theos/sdks
          ln -sf "$SDK_PATH" "/tmp/theos/sdks/iPhoneOS${SDK_VERSION}.sdk"
          ls -la /tmp/theos/sdks/
          echo "SDKVERSION=$SDK_VERSION" >> $GITHUB_ENV

      - name: Build All
        run: |
          make package messages=yes SDKVERSION=$SDKVERSION

      - name: Create .deb package
        run: |
          mkdir -p build/deb/DEBIAN
          mkdir -p build/deb/Library/Frameworks
          mkdir -p build/deb/Library/MobileSubstrate/DynamicLibraries
          mkdir -p build/deb/Library/PreferenceBundles
          mkdir -p build/deb/Library/PreferenceLoader/Preferences

          cp Andromeda.dylib/obj/Andromeda.dylib build/deb/Library/MobileSubstrate/DynamicLibraries/
          cp Andromeda.dylib/Andromeda.plist build/deb/Library/MobileSubstrate/DynamicLibraries/
          cp -r AndromedaSettings.bundle/obj/AndromedaSettings.bundle build/deb/Library/PreferenceBundles/

          cat > build/deb/Library/PreferenceLoader/Preferences/Andromeda.plist << 'EOF'
          {
              entry = {
                  bundle = AndromedaSettings;
                  cell = PSLinkCell;
                  detail = AndromedaRootListController;
                  icon = "/Library/PreferenceBundles/AndromedaSettings.bundle/Icons/icon.svg";
                  isController = 1;
                  label = Andromeda;
              };
          }
          EOF

          printf 'Package: com.andromeda.bypass\nName: Andromeda\nPre-Depends: dpkg\nDepends: firmware (>= 12.0), preferenceloader\nRecommends: mobilesubstrate\nSuggests: com.opa334.choicy\nVersion: 4.0.0\nArchitecture: iphoneos-arm\nDescription: Ultimate jailbreak detection bypass for dating apps and social media. Neutralizes hardware fingerprinting, App Attest, DeviceCheck, anti-debugging, sandbox checks, filesystem detection, dylib enumeration, and behavioral biometrics.\nMaintainer: AndromedaTeam\nAuthor: AndromedaTeam\nSection: System\n' > build/deb/DEBIAN/control

          printf '#!/bin/sh\nset -e\necho "[Andromeda] Post-installation setup..."\nmkdir -p /var/mobile/Library/Caches/com.andromeda.bypass\nif [ -f /usr/bin/sbreload ]; then\n    /usr/bin/sbreload\nfi\nexit 0\n' > build/deb/DEBIAN/postinst
          chmod 755 build/deb/DEBIAN/postinst

          printf '#!/bin/sh\nset -e\necho "[Andromeda] Cleaning up..."\nrm -rf /var/mobile/Library/Caches/com.andromeda.bypass\nexit 0\n' > build/deb/DEBIAN/postrm
          chmod 755 build/deb/DEBIAN/postrm

          cd build
          dpkg-deb -b deb com.andromeda.bypass_4.0.0_iphoneos-arm.deb
          cp com.andromeda.bypass_4.0.0_iphoneos-arm.deb ..//

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andromeda-deb
          path: com.andromeda.bypass_4.0.0_iphoneos-arm.deb

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          name: "Andromeda v4.0.0"
          body: "Ultimate jailbreak detection bypass for dating apps & social media.\n\nSupported apps: Tinder, Bumble, Hily, Badoo, Fruitz, Feels, Hinge, Grindr, Happn, OKCupid, Meetic, Instagram, Threads, Facebook, Snapchat, TikTok."
          files: com.andromeda.bypass_4.0.0_iphoneos-arm.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
