name: Build Andromeda .deb

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /tmp/theos
          echo "THEOS=/tmp/theos" >> $GITHUB_ENV

      - name: Install ldid
        run: brew install ldid

      - name: Setup SDK
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          mkdir -p /tmp/theos/sdks
          ln -sf "$SDK_PATH" "/tmp/theos/sdks/iPhoneOS${SDK_VERSION}.sdk"

      - name: Setup layout
        run: |
          mkdir -p layout/DEBIAN
          mkdir -p layout/Library/PreferenceLoader/Preferences
          mkdir -p layout/Library/Andromeda
          
          cat > layout/DEBIAN/control << 'EOF'
          Package: com.andromeda.bypass
          Name: Andromeda
          Pre-Depends: dpkg
          Depends: firmware (>= 15.0), preferenceloader
          Recommends: mobilesubstrate
          Suggests: com.opa334.choicy
          Version: 4.2.2
          Architecture: iphoneos-arm64
          Description: Rootless jailbreak detection bypass for dating apps and social media (Tinder, Bumble, Hinge, Instagram, WhatsApp and more). List every app on your device, enable protection per app and pick the bypass tools you want for each one. Targeted dynamic injection means only the apps you enable are affected.
          Maintainer: AndromedaTeam
          Author: AndromedaTeam
          Section: Tweaks
          Installed-Size: 10240
          EOF
          
          cat > layout/DEBIAN/postinst << 'EOF'
          #!/bin/sh
          set -e
          echo "[Andromeda] Post-installation setup..."
          mkdir -p /var/mobile/Library/Caches/com.andromeda.bypass
          mkdir -p /var/mobile/Library/Preferences
          FILTER_SRC=/var/jb/Library/MobileSubstrate/DynamicLibraries/Andromeda.plist
          FILTER_DST=/var/mobile/Library/Preferences/com.andromeda.bypass.Filter.plist
          if [ -f "$FILTER_SRC" ]; then
              if [ ! -f "$FILTER_DST" ]; then
                  cp "$FILTER_SRC" "$FILTER_DST"
              fi
              rm -f "$FILTER_SRC"
              ln -s "$FILTER_DST" "$FILTER_SRC"
          fi
          if [ -f /usr/bin/sbreload ]; then
              echo "[Andromeda] Refreshing SpringBoard..."
              /usr/bin/sbreload
          fi
          exit 0
          EOF
          
          cat > layout/DEBIAN/postrm << 'EOF'
          #!/bin/sh
          set -e
          echo "[Andromeda] Cleaning up..."
          rm -rf /var/mobile/Library/Caches/com.andromeda.bypass
          rm -f /var/mobile/Library/Preferences/com.andromeda.bypass.Filter.plist
          rm -f /var/jb/Library/MobileSubstrate/DynamicLibraries/Andromeda.plist
          exit 0
          EOF
          
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/postrm

      - name: Build and Package
        run: |
          make package messages=yes FINALPACKAGE=1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Andromeda-deb
          path: packages/com.andromeda.bypass_*.deb

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.2.2
          files: packages/com.andromeda.bypass_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
