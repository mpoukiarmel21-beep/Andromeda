name: Build Andromeda .deb

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /tmp/theos
          echo "THEOS=/tmp/theos" >> $GITHUB_ENV

      - name: Install ldid
        run: brew install ldid

      - name: Setup SDK
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          mkdir -p /tmp/theos/sdks
          ln -sf "$SDK_PATH" "/tmp/theos/sdks/iPhoneOS${SDK_VERSION}.sdk"

      - name: Setup layout
        run: |
          mkdir -p layout/DEBIAN
          printf 'Package: com.andromeda.bypass\nName: Andromeda\nVersion: 4.0.0\nArchitecture: iphoneos-arm64\nDepends: firmware (>= 15.0), preferenceloader\nRecommends: mobilesubstrate\nSuggests: com.opa334.choicy\nDescription: Ultimate rootless jailbreak detection bypass for dating apps and social media.\nMaintainer: AndromedaTeam\nAuthor: AndromedaTeam\nSection: System\n' > layout/DEBIAN/control
          printf '#!/bin/sh\nset -e\nexit 0\n' > layout/DEBIAN/postinst
          printf '#!/bin/sh\nset -e\nexit 0\n' > layout/DEBIAN/postrm
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/postrm

      - name: Build and Package
        run: |
          make package messages=yes FINALPACKAGE=1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Andromeda-deb
          path: packages/com.andromeda.bypass_*.deb

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          files: packages/com.andromeda.bypass_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
