<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0533;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d1b69;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0c29;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="galaxyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <circle cx="256" cy="256" r="200" fill="url(#glowGrad)" opacity="0.3"/>

  <path d="M256 80 L380 140 L380 280 C380 360 320 420 256 440 C192 420 132 360 132 280 L132 140 Z"
        fill="url(#shieldGrad)" stroke="#a855f7" stroke-width="4" filter="url(#glow)"/>

  <path d="M256 100 L360 150 L360 275 C360 345 310 395 256 415 C202 395 152 345 152 275 L152 150 Z"
        fill="none" stroke="#c084fc" stroke-width="2" opacity="0.6"/>

  <ellipse cx="256" cy="240" rx="80" ry="30" fill="none" stroke="url(#galaxyGrad)" stroke-width="3" transform="rotate(-20 256 240)" filter="url(#glow)"/>
  <ellipse cx="256" cy="240" rx="60" ry="22" fill="none" stroke="url(#galaxyGrad)" stroke-width="2" transform="rotate(-20 256 240)" opacity="0.7"/>
  <ellipse cx="256" cy="240" rx="40" ry="15" fill="none" stroke="url(#galaxyGrad)" stroke-width="2" transform="rotate(-20 256 240)" opacity="0.5"/>

  <circle cx="256" cy="240" r="12" fill="url(#galaxyGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="240" r="6" fill="#ffffff"/>

  <circle cx="200" cy="200" r="3" fill="#a855f7" opacity="0.8"/>
  <circle cx="310" cy="180" r="2" fill="#6366f1" opacity="0.7"/>
  <circle cx="280" cy="300" r="2.5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="180" cy="280" r="2" fill="#a855f7" opacity="0.5"/>
  <circle cx="330" cy="260" r="1.5" fill="#c084fc" opacity="0.7"/>
  <circle cx="220" cy="160" r="2" fill="#6366f1" opacity="0.6"/>
  <circle cx="290" cy="150" r="1.5" fill="#a855f7" opacity="0.5"/>
  <circle cx="170" cy="230" r="2" fill="#3b82f6" opacity="0.4"/>

  <path d="M220 320 L240 340 L292 288" fill="none" stroke="#4ade80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <text x="256" y="480" text-anchor="middle" font-family="SF Pro Display, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="700" fill="#e2e8f0" letter-spacing="4">ANDROMEDA</text>
</svg>
